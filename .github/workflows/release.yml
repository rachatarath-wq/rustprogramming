name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system deps (ALSA + X11 + GL)
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libxrandr-dev libgl1-mesa-dev
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0
      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked
      - name: Build (glibc 2.17 — runs on old + new Linux)
        run: |
          cd miniroblox
          RUSTFLAGS="-C link-arg=-L/usr/lib/x86_64-linux-gnu" cargo zigbuild --release --target x86_64-unknown-linux-gnu.2.17
          cp target/x86_64-unknown-linux-gnu/release/miniroblox ../miniroblox-linux
      - uses: actions/upload-artifact@v4
        with:
          name: miniroblox-linux
          path: miniroblox-linux

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --manifest-path miniroblox/Cargo.toml
      - name: Collect binary
        shell: pwsh
        run: Copy-Item miniroblox\target\release\miniroblox.exe miniroblox-windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: miniroblox-windows
          path: miniroblox-windows.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --manifest-path miniroblox/Cargo.toml
      - name: Collect binary
        run: cp miniroblox/target/release/miniroblox miniroblox-macos
      - uses: actions/upload-artifact@v4
        with:
          name: miniroblox-macos
          path: miniroblox-macos

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/miniroblox-linux/miniroblox-linux
            dist/miniroblox-windows/miniroblox-windows.exe
            dist/miniroblox-macos/miniroblox-macos
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
